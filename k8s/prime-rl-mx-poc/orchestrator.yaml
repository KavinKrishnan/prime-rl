apiVersion: apps/v1
kind: Deployment
metadata:
  name: prime-rl-orchestrator
  namespace: kavin
  labels:
    app: prime-rl-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prime-rl-orchestrator
  template:
    metadata:
      labels:
        app: prime-rl-orchestrator
    spec:
      containers:
        - name: orchestrator
          image: nvcr.io/nvidian/dynamo-dev/prime-rl-mx:latest
          command: ["python3", "-m", "prime_rl.orchestrator.orchestrator"]
          args:
            - "@"
            - "/config/orchestrator.toml"
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
              nvidia.com/gpu: "0"
            limits:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "0"
          env:
            - name: MODEL_EXPRESS_URL
              value: "modelexpress-server:8001"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: output
              mountPath: /output
            - name: shared-model-cache
              mountPath: /models
      imagePullSecrets:
        - name: nvcr-imagepullsecret
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-GB200
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "user-workload"
          effect: "NoSchedule"
        - key: "dedicated"
          operator: "Equal"
          value: "user-workload"
          effect: "NoExecute"
        - key: "kubernetes.io/arch"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "kubernetes.io/arch"
          operator: "Equal"
          value: "arm64"
          effect: "NoSchedule"
      volumes:
        - name: config
          configMap:
            name: prime-rl-mx-config
        - name: output
          emptyDir: {}
        - name: shared-model-cache
          persistentVolumeClaim:
            claimName: shared-model-cache
