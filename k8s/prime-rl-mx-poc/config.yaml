apiVersion: v1
kind: ConfigMap
metadata:
  name: prime-rl-mx-config
  namespace: kavin
data:
  train.toml: |
    max_steps = 100
    dist_timeout_seconds = 600

    [model]
    name = "Qwen/Qwen2.5-1.5B"
    attn = "sdpa"

    [tokenizer]
    name = "Qwen/Qwen2.5-1.5B"

    [optim]
    type = "adamw"
    lr = 5e-6
    weight_decay = 0.01

    [scheduler]
    type = "cosine"

    [loss]
    type = "default"

    [weight_broadcast]
    type = "modelexpress"
    mx_server_url = "modelexpress-server:8001"

    [data]

    [ckpt]
    interval = 50

  inference.toml: |
    [model]
    name = "Qwen/Qwen2.5-1.5B"
    max_model_len = 4096
    enforce_eager = true

    [parallel]
    tp = 1

    [weight_broadcast]
    type = "modelexpress"
    mx_server_url = "modelexpress-server:8001"

    [server]
    host = "0.0.0.0"
    port = 8000

  orchestrator.toml: |
    output_dir = "/output/rl-mx-poc"

    [weight_broadcast]
    type = "modelexpress"
    mx_server_url = "modelexpress-server:8001"

    max_async_level = 2

    [inference]
    urls = ["http://prime-rl-inference:8000"]
    admin_urls = ["http://prime-rl-inference:8100"]

    [rollout_transport]
    type = "filesystem"
    path = "/output/rl-mx-poc/batches"

    [env]
    name = "reverse-text"
